data:
  path: "data/compas_two_year_recidivism.csv"
  target: "two_year_recid"
  sensitive_attr: "race"                            # never a feature; used only for the fairness report
  drop_columns: ["id", "decile_score", "score_text"]  # kept in the data, never used as features

# Locked test set: never used to fit, tune or choose anything. Do not change once set.
test_set:
  size: 0.2
  random_state: 42

cv:
  n_splits: 5
  shuffle: true
  random_state: 42
  scoring: "accuracy"
  n_jobs: -1                                         # -1 = all CPU cores

diagnostics:
  id_column: "id"
  numeric_text_columns: ["priors_count", "prior_offenses"]
  # "nan" catches real NaNs turned into text by the category cleanup.
  placeholder_tokens: ["-", "?", "n/a", "N/A", "na", "NA", "", "nan"]

  validity_rules:
    age: {min: 18, max: 100}
    decile_score: {min: 1, max: 10}
    juv_fel_count: {min: 0}
    priors_count: {min: 0, max: 60}

  canonical_categories:
    sex:
      male: "Male"
      female: "Female"
    race:
      african-american: "African-American"
      african american: "African-American"
      caucasian: "Caucasian"
      hispanic: "Hispanic"
      other: "Other"
      asian: "Asian"
      native american: "Native American"
    c_charge_degree:
      f: "F"
      felony: "F"
      m: "M"
      misdemeanor: "M"
    score_text:
      low: "Low"
      medium: "Medium"
      high: "High"
  redundant_columns: ["prior_offenses", "age_in_months", "juvenile_total"]

preprocessing:
  encoder: "target"                                 # onehot | ordinal | count | target
  scaler: "robust"                                  # none | standard | minmax | robust
  numeric_features: ["age", "juv_fel_count", "juv_misd_count", "juv_other_count", "priors_count"]
  categorical_features: ["sex", "age_cat", "c_charge_degree"]
  mnar_indicator_sources: ["priors_count", "c_charge_degree"]   # get a <col>_was_missing flag
  random_state: 42                                  # target encoder's internal folds
  imputation:
    numeric_strategy: "median"
    categorical_strategy: "most_frequent"

model:
# one of: "dummy" (majority-class floor), "logistic_regression", "decision_tree", "random_forest"

# Decision Tree
  # type: "decision_tree"
  # params:
  #   max_depth: 5
  #   random_state: 42

# Logistic Regression
  type: "logistic_regression"
  params:
    max_iter: 1000
    random_state: 42

# Random Forest
  # type: "random_forest"
  # params:
  #   n_estimators: 300
  #   random_state: 42   # forests are random (bootstrap rows + random feature subsets): fix the seed
  #   n_jobs: -1         # use every CPU core -- the trees are independent, so they train in parallel

tuning:
  enabled: true
  n_trials: 15
  n_splits: 5
  random_state: 42
  # Keys are Pipeline parameter names. Types: int / float (low, high, log) or categorical (choices).
  search_spaces:
    logistic_regression:
      model__C: {type: float, low: 1e-4, high: 100, log: true}
      model__max_iter: {type: int, low: 100, high: 2000}
      model__solver: {type: categorical, choices: ["liblinear", "lbfgs"]}

    decision_tree:
      model__max_depth: {type: int, low: 1, high: 20}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__criterion: {type: categorical, choices: ["gini", "entropy"]}
      prep__numeric__impute__strategy: {type: categorical, choices: ["median", "mean"]}

    random_forest:
      model__n_estimators: {type: int, low: 10, high: 100, log: true}
      model__max_depth: {type: categorical, choices: [null, 1, 5, 10, 15, 20]}
      model__min_samples_leaf: {type: int, low: 1, high: 200, log: true}
      model__max_features: {type: categorical, choices: ["sqrt", "log2", 0.5, 1.0]}

output:
  results_dir: "results"
